<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日任务</title>
<style>
  :root{
    --paper:#FBFAF6; --panel:#FFFFFF; --line:#E4DFD4;
    --ink:#45423C; --ink-soft:#8F8A80; --ink-faint:#B5AFA4;
    --accent:#C9B9A6; --accent-ink:#8A7A66; --done:#B5AFA4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:#EDEAE2;color:var(--ink);min-height:100vh;
    display:flex;justify-content:center;padding:40px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:520px;max-width:100%}
  header{
    background:var(--paper);border:1px solid var(--line);border-radius:14px;
    padding:22px 24px;margin-bottom:18px;
  }
  header h1{font-size:18px;font-weight:600;letter-spacing:2px}
  header .date{font-size:12px;color:var(--ink-soft);margin-top:4px}
  .progress{display:flex;align-items:center;gap:10px;margin-top:14px}
  .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
  .progress .txt{font-size:12px;color:var(--ink-soft);white-space:nowrap}
  section{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin-bottom:18px;
  }
  section h2{font-size:13px;font-weight:600;letter-spacing:1px;margin-bottom:12px;color:var(--ink)}
  section h2 .cnt{font-size:11px;color:var(--ink-faint);font-weight:400;margin-left:6px}
  .item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent-ink);cursor:pointer;flex:none}
  .item .name{flex:1;font-size:14.5px;line-height:1.5}
  .item.done .name{color:var(--done);text-decoration:line-through}
  .item .x{border:none;background:none;color:var(--ink-faint);font-size:16px;cursor:pointer;padding:0 4px}
  .item .x:hover{color:var(--danger,#B9807C)}
  .addrow{display:flex;gap:8px;margin-top:12px}
  .addrow input{
    flex:1;border:1px solid var(--line);padding:9px 12px;border-radius:8px;
    font-size:13.5px;outline:none;color:var(--ink);background:var(--panel);
  }
  .addrow input:focus{border-color:var(--accent)}
  .addrow button{
    border:none;background:var(--accent);color:#fff;font-size:13px;padding:9px 16px;
    border-radius:8px;cursor:pointer;white-space:nowrap;
  }
  .hint{font-size:11.5px;color:var(--ink-faint);margin-top:10px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>今日任务</h1>
    <div class="date" id="date"></div>
    <div class="progress">
      <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
      <div class="txt" id="progTxt">0 / 0</div>
    </div>
  </header>

  <section>
    <h2>计划任务<span class="cnt" id="recurCnt"></span></h2>
    <div id="recurringList"></div>
    <div class="addrow">
      <input id="recurInput" placeholder="加一个每天要做的（如：投简历）" />
      <button onclick="addRecurring()">＋计划</button>
    </div>
  </section>

  <section>
    <h2>随手任务<span class="cnt" id="adHocCnt"></span></h2>
    <div id="adHocList"></div>
    <div class="addrow">
      <input id="adHocInput" placeholder="今天随手要做的事" />
      <button onclick="addAdHoc()">＋随手</button>
    </div>
    <div class="hint">计划任务每天自动出现；随手任务只属于今天。勾掉即记录完成，明天清零重新来。</div>
  </section>
</div>

<script>
let state = {tasks:[], done:0, total:0};

async function loadTasks(){
  const r = await fetch('/api/tasks').then(x=>x.json());
  state = r;
  document.getElementById('date').textContent = r.date;
  render();
}

function render(){
  const rec = state.tasks.filter(t=>t.type==='recurring');
  const adh = state.tasks.filter(t=>t.type==='ad_hoc');
  document.getElementById('recurCnt').textContent = rec.length ? `(${rec.length})` : '';
  document.getElementById('adHocCnt').textContent = adh.length ? `(${adh.length})` : '';
  document.getElementById('recurringList').innerHTML = rec.map(itemHtml).join('') || '<div class="hint">还没有计划任务</div>';
  document.getElementById('adHocList').innerHTML = adh.map(itemHtml).join('') || '<div class="hint">今天没有随手任务</div>';
  const pct = state.total ? Math.round(state.done/state.total*100) : 0;
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('progTxt').textContent = state.done + ' / ' + state.total;
}

function itemHtml(t){
  return '<div class="item'+(t.done?' done':'')+'">'
    + '<input type="checkbox" '+(t.done?'checked':'')+' onchange="toggle(\''+esc(t.name)+'\',\''+t.type+'\')">'
    + '<span class="name">'+esc(t.name)+'</span>'
    + '<button class="x" onclick="removeTask(\''+esc(t.name)+'\',\''+t.type+'\')" title="删除">×</button>'
    + '</div>';
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

async function post(body){
  await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  await loadTasks();
}

function toggle(name, type){ post({action:'toggle', name, type}); }
function removeTask(name, type){ post({action: type==='recurring'?'remove_recurring':'remove_ad_hoc', name}); }
function addAdHoc(){ const v=document.getElementById('adHocInput').value.trim(); if(!v) return; document.getElementById('adHocInput').value=''; post({action:'add_ad_hoc', name:v}); }
function addRecurring(){ const v=document.getElementById('recurInput').value.trim(); if(!v) return; document.getElementById('recurInput').value=''; post({action:'add_recurring', name:v}); }

document.getElementById('adHocInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addAdHoc(); });
document.getElementById('recurInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addRecurring(); });

loadTasks();
</script>
</body>
</html>
